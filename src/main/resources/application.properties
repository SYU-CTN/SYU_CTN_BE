spring.config.import=optional:classpath:application-secret.yml

spring.datasource.url=jdbc:mysql://localhost:3306/syu_ctn_be?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small
rag.provider=chroma
rag.ingestion.enabled=true
rag.knowledge-location=classpath:knowledge/*.txt
rag.top-k=5
rag.similarity-threshold=0.65
rag.max-chunk-length=900
rag.chunk-overlap=120
rag.chroma.base-url=http://localhost:8000
rag.chroma.tenant=default_tenant
rag.chroma.database=default_database
rag.chroma.collection-name=curriculum_chatbot_collection

openai.model=gpt-4o-mini
openai.embedding-model=text-embedding-3-small
openai.timeout-ms=15000
