spring.config.import=optional:classpath:application-secret.yml

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tree_navigator?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=020822
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

rag.provider=chroma
rag.ingestion.enabled=true
rag.knowledge-location=classpath:knowledge/*.txt
rag.top-k=5
rag.similarity-threshold=0.65
rag.max-chunk-length=900
rag.chunk-overlap=120
rag.chroma.base-url=http://localhost:8000
rag.chroma.tenant=default_tenant
rag.chroma.database=default_database
rag.chroma.collection-name=curriculum_chatbot_collection

openai.model=gpt-4o-mini
openai.embedding-model=text-embedding-3-small
openai.timeout-ms=15000
